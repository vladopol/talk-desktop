# Builds the custom distributables for all platforms.
# Not part of upstream - specific to this fork.
#
# The built-in Talk is taken from a matching branch of the spreed fork, which
# carries the Talk-side changes (browse during call, camera release).

name: Build custom distributables

on:
  # Push a tag to build, e.g. `git tag build-1 && git push fork build-1`.
  # A tag trigger works from any branch, unlike workflow_dispatch, which GitHub
  # only registers once the workflow file is on the default branch.
  push:
    tags:
      - build-*
  workflow_dispatch:
    inputs:
      spreed_ref:
        description: Branch or tag of the spreed fork to bundle as the built-in Talk
        default: build/custom
        required: true

permissions:
  contents: read

env:
  # Stable channel - no channel badge in the UI, no channel suffix in artifact names
  CHANNEL: stable
  SPREED_REPOSITORY: vladopol/spreed
  # On a tag build there are no inputs, so fall back to the integration branch
  SPREED_REF: ${{ inputs.spreed_ref || 'build/custom' }}

concurrency:
  group: build-custom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (msi + exe)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout talk-desktop
        uses: actions/checkout@v5

      - name: Checkout built-in Talk
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SPREED_REPOSITORY }}
          ref: ${{ env.SPREED_REF }}
          path: spreed

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # The WiX Toolset is required by @electron-forge/maker-wix to build the MSI.
      # It is not guaranteed to be present on the runner image, so install it unless it is.
      - name: Set up WiX Toolset
        shell: pwsh
        run: |
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wixBin\candle.exe")) {
            choco install wixtoolset --version=3.14.1 --no-progress --yes
          }
          if (-not (Test-Path "$wixBin\candle.exe")) {
            throw "WiX Toolset was not found at $wixBin after installation"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Install dependencies
        run: npm ci

      - name: Install built-in Talk dependencies
        run: npm ci --prefix spreed

      - name: Package application
        run: npm run build:windows:x64

      - name: Make distributables
        run: npm run package:windows:x64

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            out/make/**/*.msi
            out/make/**/*.exe
          if-no-files-found: error

  linux:
    name: Linux x64 (flatpak + zip)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout talk-desktop
        uses: actions/checkout@v5

      - name: Checkout built-in Talk
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SPREED_REPOSITORY }}
          ref: ${{ env.SPREED_REF }}
          path: spreed

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # @malept/electron-installer-flatpak shells out to flatpak-builder and to
      # eu-strip (elfutils). The runtime and base app versions must match the ones
      # configured for MakerFlatpak in forge.config.js.
      - name: Set up Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Install dependencies
        run: npm ci

      - name: Install built-in Talk dependencies
        run: npm ci --prefix spreed

      - name: Package application
        run: npm run build:linux

      - name: Make zip distributable
        run: ./node_modules/.bin/electron-forge make --skip-package --platform=linux --targets=zip

      # Flatpak is the fragile half: @malept/flatpak-bundler shells out to flatpak
      # and only reports the exit code, hiding the actual error behind its `debug`
      # logger - hence DEBUG. It must not take the working zip down with it.
      - name: Make flatpak distributable
        id: flatpak
        continue-on-error: true
        env:
          DEBUG: '@malept/flatpak-bundler'
        run: ./node_modules/.bin/electron-forge make --skip-package --platform=linux --targets=flatpak

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            out/make/**/*.zip
            out/make/**/*.flatpak
          if-no-files-found: error

      - name: Report flatpak failure
        if: steps.flatpak.outcome == 'failure'
        run: |
          echo "::warning::The zip was built and uploaded, but the flatpak failed. See the 'Make flatpak distributable' step for the flatpak-builder output."

  macos:
    name: macOS universal (dmg)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout talk-desktop
        uses: actions/checkout@v5

      - name: Checkout built-in Talk
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SPREED_REPOSITORY }}
          ref: ${{ env.SPREED_REF }}
          path: spreed

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install built-in Talk dependencies
        run: npm ci --prefix spreed

      # appdmg -> ds-store -> macos-alias calls util.isDate(), one of the legacy
      # util.is* helpers Node removed in v23, so the DMG maker cannot run on Node 24.
      # macos-alias has been unmaintained since 2017, so patch the call site after
      # install. Preloading a shim via NODE_OPTIONS is not an option: the runner
      # refuses to set NODE_OPTIONS through $GITHUB_ENV.
      - name: Patch macos-alias for Node 24
        run: |
          node - <<'PATCH'
          const fs = require('node:fs')
          const file = 'node_modules/macos-alias/lib/encode.js'
          const source = fs.readFileSync(file, 'utf8')
          const patched = source.replace('util.isDate(value)', "(Object.prototype.toString.call(value) === '[object Date]')")
          if (patched === source) {
            throw new Error(`No util.isDate call found in ${file} - the workaround is stale and should be removed`)
          }
          fs.writeFileSync(file, patched)
          PATCH

      # Unsigned builds are ad-hoc signed by forge.config.js, so no certificates
      # or notarization credentials are needed here. Users allow the app once via
      # System Settings on first launch.
      - name: Package application
        run: npm run build:mac

      - name: Make distributables
        run: npm run package:mac

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: out/make/**/*.dmg
          if-no-files-found: error
